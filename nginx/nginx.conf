events {}

http {
    # Обрабатывать запросы к статике
    server {
        listen 80;

        # Статические страницы из папки
        location / {
            root /usr/share/nginx/html;
            index delivery.html contacts.html;
        }

        # Всё, что .php — проксируем на Apache
        location ~ \.php$ {
            proxy_pass http://web:80;
            proxy_redirect http://web /;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
        }

        # Папка /api — тоже проксируем на Apache
        location /api/ {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Остальные динамические пути (drawer, sort, server) — тоже на Apache
        location ~ ^/(drawer|sort|server)/ {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}